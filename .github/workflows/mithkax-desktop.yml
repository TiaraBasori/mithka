name: MithkaX Desktop Release

# Builds every non-iOS platform from master and attaches the artifacts to a
# GitHub release. Android has its own workflow (mithkax-android.yml); iOS is
# intentionally not built by this fork.
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: x64, os: ubuntu-24.04}
          - {architecture: arm64, os: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: matrix.architecture == 'x64'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Install Flutter on arm64
        if: matrix.architecture == 'arm64'
        run: |
          git clone --depth 1 --branch 3.44.2 --config advice.detachedHead=false \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libavcodec-dev libavformat-dev libavutil-dev \
            libcurl4-openssl-dev libgtk-3-dev libjpeg-dev liblzma-dev \
            libkeybinder-3.0-dev libsecret-1-dev libswscale-dev libpulse0 \
            libgirepository1.0-dev librsvg2-dev patchelf \
            desktop-file-utils ninja-build pkg-config xvfb xdotool
      - name: Prepare dependencies and tdjson
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          : "${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
          : "${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF
          flutter pub get
          scripts/build-tdjson-desktop.sh linux "native-libs/libtdjson.so" '${{ matrix.architecture }}'
      - name: Build Linux release
        run: |
          flutter build linux --release --target-platform=linux-${{ matrix.architecture }} \
            --dart-define="I_DONT_FUCKING_CARE_ABOUT_TOS=true"
          bundle='build/linux/${{ matrix.architecture }}/release/bundle'
          install -m 0755 native-libs/libtdjson.so "$bundle/lib/libtdjson.so"
          tar -C "$bundle/.." -czf "$RUNNER_TEMP/mithkax-linux-${{ matrix.architecture }}.tar.gz" "$(basename "$bundle")"
          scripts/build-linux-appimage.sh '${{ matrix.architecture }}' "$bundle" "$RUNNER_TEMP/MithkaX-linux-${{ matrix.architecture }}.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: mithkax-linux-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/mithkax-linux-${{ matrix.architecture }}.tar.gz
            ${{ runner.temp }}/MithkaX-linux-${{ matrix.architecture }}.AppImage

  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Prepare dependencies and tdjson
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          : "${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
          : "${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF
          flutter config --enable-swift-package-manager
          flutter pub get
          scripts/build-tdjson-desktop.sh macos "native-libs/libtdjson.dylib" universal
          sh scripts/refresh-apple-mdk.sh refresh
          sh scripts/refresh-apple-mdk.sh check
      - name: Build macOS release
        run: |
          flutter build macos --release --dart-define="I_DONT_FUCKING_CARE_ABOUT_TOS=true"
          app='build/macos/Build/Products/Release/Mithka X.app'
          test -f "$app/Contents/MacOS/Mithka X"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/MithkaX-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mithkax-macos-universal
          path: ${{ runner.temp }}/MithkaX-macos-universal.zip

  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: x64, os: windows-2022}
          - {architecture: arm64, os: windows-11-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: matrix.architecture == 'x64'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Install Flutter on arm64
        if: matrix.architecture == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.2 --config advice.detachedHead=false \
            https://github.com/flutter/flutter.git /c/flutter
          /c/flutter/bin/flutter --version
          echo 'C:\flutter\bin' >> "$GITHUB_PATH"
      - name: Prepare dependencies and tdjson
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          : "${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
          : "${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF
          flutter pub get
          scripts/build-tdjson-desktop.sh windows "native-libs/tdjson.dll" '${{ matrix.architecture }}'
          if [ '${{ matrix.architecture }}' = arm64 ]; then
            python3 scripts/drop-windows-plugin.py firebase_core \
              --reason 'Firebase publishes no Windows ARM64 binaries'
            flutter pub get
          fi
      - name: Build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CL = "$env:CL /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release --no-pub --dart-define="I_DONT_FUCKING_CARE_ABOUT_TOS=true"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release compilation failed' }
          if (-not (Test-Path 'build/windows/${{ matrix.architecture }}/runner/Release/mithka.exe')) {
            throw 'Expected Windows release executable is missing'
          }
          Compress-Archive -Path 'build/windows/${{ matrix.architecture }}/runner/Release/*' `
            -DestinationPath "$env:RUNNER_TEMP/MithkaX-windows-${{ matrix.architecture }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mithkax-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/MithkaX-windows-${{ matrix.architecture }}.zip
