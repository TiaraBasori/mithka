name: MithkaX Android Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed MithkaX APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Write Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          : "${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
          : "${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          : "${KEYSTORE_B64:?set ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?set ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?set ANDROID_KEY_ALIAS}"
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Decode Firebase config
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          # The Firebase config is repo-secret; a missing secret must not
          # break a signed build, it only ships without FCM/analytics.
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_B64 not set; building without Firebase"
          fi

      - name: Install pinned tdjson
        run: |
          scripts/build-tdjson-android.sh arm64-v8a
          scripts/build-tdjson-android.sh armeabi-v7a

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --dart-define="I_DONT_FUCKING_CARE_ABOUT_TOS=true" \
            --target-platform android-arm64,android-arm

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mithkax-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
